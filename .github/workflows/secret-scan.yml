name: 秘密扫描

# 防止真实凭据进入仓库（工作区 + git 历史）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能扫描
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 扫描真实凭据
        run: node tools/secret-scan.cjs
